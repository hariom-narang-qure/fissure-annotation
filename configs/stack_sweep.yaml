# Step 1 of the stack agent test (https://claude.ai/artifact/3wbEVy3bgTLqv37X9rtrkX): which stack size works.
# Three failures of the one-slice agent and one guard case it gets right, all on locca_covid_013.
# locca_covid_028 is left out: its ground glass saturates the lung window, so no stack can show a fissure.
# Standard tier, since flex had little capacity on 2026-10-29.
out_dir: work/stack_agent/sweep
stack_sizes: [1, 3, 5, 7]
slice_step: 4
repeats: 1
stacks:
  - {run_dir: work/scans/locca_covid_013/flex_step4, view: coronal, centre: 344}
  - {run_dir: work/scans/locca_covid_013/flex_step4, view: sagittal, centre: 288}
  - {run_dir: work/scans/locca_covid_013/flex_step4, view: axial, centre: 164}
  - {run_dir: work/scans/locca_covid_013/flex_step4, view: axial, centre: 240}
prices:
  default: {input: 2.00, cached_input: 0.10, cache_write: 2.50, output: 10.00}
  flex: {input: 1.00, cached_input: 0.05, cache_write: 1.25, output: 5.00}
