# The fissure pipeline as it stands: gpt-6.1-terra, the stack agent on the ridge map, no lobe guides, slices 3 apart.
# - The prompt and the ridge cap of 20 are terra experiment 09, see docs/stack_agent_experiments.md.
# - Post-processing trims lines outside the TotalSegmentator lobes, which the run segments first.
# - Give another scan list with --csv. Add --agent.service-tier flex for the cheaper, slower tier.
csv: configs/emphysema_scans.csv
scans_dir: /realdata/hariom.narang/qmuse/data/scans
out_root: work/scans
run_name: terra_ridge_step3
slice_step: 3
views: [axial, coronal, sagittal]
workers: 8  # stacks in flight, each with 5 slices
agent:
  model: "@openai/gpt-6.1-terra"
annotator:
  size: 5
  prompt: prompts/stack_agent_ridge.txt
  pictures: {display_max: 20}
totalsegmentator:
  command: [/home/hariom.narang/fissure-work-bak/1.2.392.200036.9116.2.6.1.54365.1690017023.1783390643.994211/fusion/tools/ts_venv/bin/python, -m, totalsegmentator.bin.TotalSegmentator]
  gpu_index: 0
