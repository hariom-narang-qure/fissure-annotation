# 5 LOCCA cases (from locca_eval_cases.csv) through the flex_step4 experiment of severe_scans_flex.yaml.
# locca_covid_014 of the eval cases was left out, its 1126 slices cost too much.
# Post-processing uses the manual LOCCA lobes and not TotalSegmentator.
# - work/datasets/locca/prepare_flex_step4.py puts them in each run folder, where post-processing reads them first.
# - It also links the scans into scans_dir in the layout of the qmuse store.
csv: configs/locca_flex_step4_cases.csv
uid_column: case_id
scans_dir: /home/hariom.narang/fissure-annotation/work/datasets/locca/store  # absolute, since the run folder links its scan to it
out_root: work/scans
run_name: flex_step4
slice_step: 4
views: [axial, coronal, sagittal]
workers: 16
agent:
  service_tier: flex
totalsegmentator:
  command: [/home/hariom.narang/fissure-work-bak/1.2.392.200036.9116.2.6.1.54365.1690017023.1783390643.994211/fusion/tools/ts_venv/bin/python, -m, totalsegmentator.bin.TotalSegmentator]
  gpu_index: 0
