# Held-out check: the base terra ridge map run without guides on 4 new stacks.
# The ridge map run without guides with gpt-6.1-terra instead of gpt-6.1-sol: stack_agent_eval40_step3_ridge_no_guides.yaml with another model.
# Prices are terra list prices from Portkey's price table, half of sol's.
# The tracer still runs on the CT.
# The one-slice baseline ran at step 4, so it has only the centre slice of each stack.
out_dir: work/stack_agent/terra_exp91_heldout_terra_base
agent:
  model: "@openai/gpt-6.1-terra"
prompt: prompts/stack_agent_ridge_no_guides.txt
pictures: {kind: ridge, display_max: 30}  # white from 30 grey levels, about 70 HU
hint_band_mm: null  # no guides
stack_sizes: [5]
slice_step: 3
repeats: 2
# Held-out stacks: centres at least 20 slices from every eval centre of the same scan and view, each inside the lungs.
# lung_002 sagittal 340 is the right lung (lobes 12, 13, 14), so it has both right fissures.
stacks:
  - {run_dir: work/scans/locca_covid_013/flex_step4, view: axial, centre: 205}
  - {run_dir: work/scans/locca_covid_013/flex_step4, view: coronal, centre: 236}
  - {run_dir: work/scans/lung_002/flex_step4, view: axial, centre: 160}
  - {run_dir: work/scans/lung_002/flex_step4, view: sagittal, centre: 340}
prices:
  default: {input: 1.00, cached_input: 0.05, cache_write: 1.25, output: 5.00}
  flex: {input: 0.50, cached_input: 0.025, cache_write: 0.625, output: 2.50}
