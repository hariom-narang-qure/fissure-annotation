# Paths come from flags (--nifti, --mask-path, --lobes, --out-dir). The views are the ones make_fissure_mask was run with, each needs its mask next to the combined one.
views: [axial, coronal, sagittal]
max_distance_mm: 10.0
# 1 when the model annotated every slice, 2 for every other slice, 3 for every third. The sheet settings follow it unless they are set under `sheet:`.
slice_step: 1
# The lung lobes are segmented from the scan when the --lobes file does not exist. Say how to start TotalSegmentator when it is not on the PATH, for example:
# totalsegmentator:
#   command: [/path/to/venv/bin/python, -m, totalsegmentator.bin.TotalSegmentator]
#   gpu_index: 0
